
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liga de balonmano - Solo lectura</title>

<style>
  :root{--bg:#f7f7f8;--fg:#111;--muted:#666;--card:#fff;--border:#e6e6e6}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,Noto Sans,Helvetica,Arial}
  .container{max-width:1100px;margin:0 auto;padding:16px}
  h1{margin-top:0;font-size:clamp(22px,3.5vw,30px)}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);margin-bottom:16px}
  table{border-collapse:collapse;width:100%}
  th,td{border-bottom:1px solid var(--border);text-align:left;padding:6px 8px}
  thead th{background:#f0f0f2;font-weight:600}
  .muted{color:var(--muted);font-size:14px}
  .badge{display:inline-block;padding:2px 6px;border-radius:999px;font-size:11px;border:1px solid var(--border);margin-left:6px}
  .flex{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
  select{border:1px solid var(--border);border-radius:10px;padding:6px 8px;background:#fff;color:var(--fg)}

  #seasonEnd{display:none;text-align:center;font-size:18px;margin-bottom:10px;font-weight:bold;color:#0a7}

  .gold{background:#fff4c2}
  .silver{background:#eeeeee}
  .bronze{background:#f3d2b3}

  .result-win{background:#d8f5dc}
  .result-draw{background:#fff3bf}
  .result-loss{background:#ffd6e0}

  .team-with-logo{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:180px;
  }

  .team-logo{
    width:26px;
    height:26px;
    object-fit:contain;
    flex:0 0 26px;
  }

  .venue-wrap{
    display:flex;
    flex-direction:column;
    gap:4px;
    min-width:150px;
  }

  .venue-top{
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }

  .venue-name{
    font-weight:600;
  }

  .venue-toggle{
    border:0;
    background:transparent;
    padding:0;
    font:inherit;
    cursor:pointer;
    text-decoration:underline;
    opacity:.8;
  }

  .venue-address{
    display:none;
    font-size:12px;
    line-height:1.35;
    opacity:.85;
  }

  .venue-address.show{
    display:block;
  }

  @media (min-width: 900px){
    .venue-address{
      display:block;
    }
    .venue-toggle{
      display:none;
    }
  }

</style>
</head>

<body>
<div class="container">

  <header class="card">
    <div id="seasonEnd">🏆 Temporada finalizada</div>

    <div class="flex">
      <div>
        <h1 id="leagueTitle">Liga de balonmano</h1>
        <p class="muted" id="pointsInfo"></p>
      </div>

      <div>
        <label class="muted" for="teamFilter">
          <b>Filtrar partidos por equipo</b>
        </label><br>
        <select id="teamFilter">
          <option value="">Todos los equipos</option>
        </select>
      </div>
    </div>
  </header>

  <section class="card">
    <h2 style="margin-top:0">Clasificación</h2>
    <div style="overflow:auto">
      <table id="tableStandings">
        <thead>
          <tr>
            <th>Pos</th><th>Equipo</th><th>PJ</th><th>G</th><th>E</th><th>P</th>
            <th>GF</th><th>GC</th><th>DG</th><th>Pts</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="noStandingsMsg" style="display:none">No hay datos de clasificación.</p>
  </section>

  <section class="card">
    <h2 style="margin-top:0">Partidos</h2>
    <div style="overflow:auto">
      <table id="tableMatches">
        <thead>
          <tr>
            <th>Fecha</th><th>Hora</th><th>Jornada</th><th>Local</th><th>Resultado</th><th>Visitante</th><th>Lugar</th><th>Mapa</th><th>Notas</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <p class="muted" id="noMatchesMsg" style="display:none">No hay partidos registrados.</p>
  </section>

  <footer class="muted">
    Vista solo lectura. Los datos provienen del archivo <code>liga.json</code>.
    <br>Versión: <b>2026.10.12.3</b>
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<script>
(async function(){

  const $ = s => document.querySelector(s);
  let data = null;

  function getSortedTeams(){
    return (data?.teams || [])
      .slice()
      .sort((a,b)=>a.name.localeCompare(b.name,"es",{sensitivity:"base"}));
  }

  function normalizeTeamName(name){
    return (name || "")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g,"")
      .toUpperCase()
      .trim();
  }

  function getTeamLogo(name){
    const n = normalizeTeamName(name);

    if(n.includes("AMPA BZG KUKULLAGA IKAS")) return "logos/bzg.png?v=2026.10.12.3";
    if(n.includes("ANAITASUNA IKASTOLA")) return "logos/anaitasuna_club.png?v=2026.10.12.3";
    if(n.includes("EBB COOP BASAURI")) return "logos/coop_basauri.png?v=2026.10.12.3";
    if(n === "ARANGOITI") return "logos/arangoiti.png?v=2026.10.12.3";
    if(n.includes("BELTZAGORRI")) return "logos/beltzagorri.png?v=2026.10.12.3";
    if(n.includes("ESCOLAPIOS")) return "logos/escolapios.png?v=2026.10.12.3";
    if(n.includes("ESKOLABARRI")) return "logos/eskolabarri.png?v=2026.10.12.3";
    if(n.includes("KUKULLAGA ETXEBARRI")) return "logos/kukullaga.png?v=2026.10.12.3";
    if(n.includes("LOYOLA INDAUTXU")) return "logos/loyola.png?v=2026.10.12.3";

    return "";
  }

  function teamNameWithLogo(name){
    const safeName = (name || "").replace(/</g,"&lt;");
    const logo = getTeamLogo(name);

    if(!logo){
      return `<b>${safeName}</b>`;
    }

    return `
      <span class="team-with-logo">
        <img class="team-logo" src="${logo}" alt="" onerror="this.style.display='none'">
        <b>${safeName}</b>
      </span>
    `;
  }

  async function loadData(){
    try{
      const res = await fetch('liga.json?_=' + Date.now());

      if(!res.ok){
        throw new Error('No se pudo cargar liga.json');
      }

      data = await res.json();

      renderAll();
      lanzarConfetiFinalTemporada();

    }catch(err){
      console.error(err);
      $("#leagueTitle").textContent = "No se pudo cargar la liga";
      $("#pointsInfo").textContent = "Revisa que el archivo liga.json esté junto a este viewer.html.";
      $("#noStandingsMsg").style.display = "";
      $("#noMatchesMsg").style.display = "";
    }
  }

  function computeStandings(){
    if(!data) return [];

    const map = new Map();
    const teams = data.teams || [];
    const matches = data.matches || [];

    const ptsW = Number(data.pointsWin ?? 3);
    const ptsD = Number(data.pointsDraw ?? 1);
    const ptsL = Number(data.pointsLoss ?? 0);

    teams.forEach(t=>{
      map.set(t.id,{
        teamId:t.id,
        team:t.name,
        PJ:0,G:0,E:0,P:0,GF:0,GC:0,DG:0,Pts:0
      });
    });

    matches.forEach(m=>{
      if(!map.has(m.homeId) || !map.has(m.awayId)) return;
      if(m.homeGoals == null || m.awayGoals == null) return;

      const H = map.get(m.homeId);
      const A = map.get(m.awayId);

      H.PJ++;
      A.PJ++;

      H.GF += m.homeGoals;
      H.GC += m.awayGoals;

      A.GF += m.awayGoals;
      A.GC += m.homeGoals;

      H.DG = H.GF - H.GC;
      A.DG = A.GF - A.GC;

      if(m.homeGoals > m.awayGoals){
        H.G++; A.P++;
        H.Pts += ptsW;
        A.Pts += ptsL;
      }else if(m.homeGoals < m.awayGoals){
        A.G++; H.P++;
        A.Pts += ptsW;
        H.Pts += ptsL;
      }else{
        H.E++; A.E++;
        H.Pts += ptsD;
        A.Pts += ptsD;
      }
    });

    const arr = Array.from(map.values()).sort((a,b)=>{
      if(b.Pts !== a.Pts) return b.Pts - a.Pts;
      if(b.DG !== a.DG) return b.DG - a.DG;
      if(b.GF !== a.GF) return b.GF - a.GF;
      return a.team.localeCompare(b.team,"es",{sensitivity:"base"});
    });

    return arr.map((r,i)=>Object.assign({Pos:i+1},r));
  }

  function renderStandings(){
    const rows = computeStandings();
    const tb = $("#tableStandings tbody");

    tb.innerHTML = "";

    if(rows.length === 0){
      $("#noStandingsMsg").style.display = "";
      return;
    }

    $("#noStandingsMsg").style.display = "none";

    rows.forEach(r=>{
      const tr = document.createElement("tr");

      if(data.highlightPodium){
        if(r.Pos === 1) tr.className = "gold";
        else if(r.Pos === 2) tr.className = "silver";
        else if(r.Pos === 3) tr.className = "bronze";
      }

      let posText = r.Pos;

      if(data.highlightPodium){
        if(r.Pos === 1) posText = "🥇 1";
        else if(r.Pos === 2) posText = "🥈 2";
        else if(r.Pos === 3) posText = "🥉 3";
      }

      tr.innerHTML = `
        <td>${posText}</td>
        <td>${teamNameWithLogo(r.team)}</td>
        <td>${r.PJ}</td>
        <td>${r.G}</td>
        <td>${r.E}</td>
        <td>${r.P}</td>
        <td>${r.GF}</td>
        <td>${r.GC}</td>
        <td>${r.DG}</td>
        <td><b>${r.Pts}</b></td>
      `;

      tb.appendChild(tr);
    });
  }

  function renderTeamFilter(){
    const sel = $("#teamFilter");
    if(!data || !sel) return;

    const teams = getSortedTeams();

    sel.innerHTML =
      '<option value="">Todos los equipos</option>' +
      teams
        .map(t=>`<option value="${t.id}">${t.name.replace(/</g,'&lt;')}</option>`)
        .join("");
  }

  function getEffectiveVenue(match){
    const home = (data?.teams || []).find(t => t.id === match.homeId);
    return (match.venue || "").trim() || (home?.venue || "").trim();
  }

  function getEffectiveMapsUrl(match){
    const home = (data?.teams || []).find(t => t.id === match.homeId);
    return (match.mapsUrl || "").trim() || (home?.mapsUrl || "").trim();
  }

  function splitVenue(venue){
    const text = (venue || "").trim();
    if(!text) return { name:"", address:"" };

    const patterns = [
      /\s+(Calle|C\/|Carrer|Kalea|Avenida|Av\.|Alameda|Zumarkalea|Plaza|Paseo|Camino|Carretera|Barrio)\b/i,
      /,\s*(\d{5})\b/
    ];

    let idx = -1;
    for(const p of patterns){
      const m = text.match(p);
      if(m && m.index > 0){
        idx = m.index;
        break;
      }
    }

    if(idx > 0){
      return {
        name: text.slice(0, idx).trim().replace(/[,.]$/, ""),
        address: text.slice(idx).trim().replace(/^,\s*/, "")
      };
    }

    const comma = text.indexOf(",");
    if(comma > 0){
      return {
        name: text.slice(0, comma).trim(),
        address: text.slice(comma + 1).trim()
      };
    }

    return { name:text, address:"" };
  }

  function escapeHtml(s){
    return (s || "")
      .replace(/&/g,"&amp;")
      .replace(/</g,"&lt;")
      .replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function venueHtml(match){
    const venue = getEffectiveVenue(match);
    const parts = splitVenue(venue);
    if(!parts.name && !parts.address) return "";

    const id = "addr_" + match.id;
    const toggle = parts.address
      ? `<button class="venue-toggle" type="button" data-target="${id}">Ver dirección</button>`
      : "";

    return `
      <div class="venue-wrap">
        <div class="venue-top">
          <span class="venue-name">${escapeHtml(parts.name)}</span>
          ${toggle}
        </div>
        ${parts.address ? `<div class="venue-address" id="${id}">${escapeHtml(parts.address)}</div>` : ""}
      </div>
    `;
  }

  function renderMatches(){
    const tb = $("#tableMatches tbody");
    const noMsg = $("#noMatchesMsg");

    tb.innerHTML = "";

    if(!data){
      noMsg.style.display = "";
      return;
    }

    const teamId = $("#teamFilter").value;
    const teams = data.teams || [];
    const matches = (data.matches || []).slice();

    matches.sort((a,b)=>{
      const da = a.date || "";
      const db = b.date || "";

      if(da !== db) return da.localeCompare(db);

      const ra = (a.round || "").toString();
      const rb = (b.round || "").toString();

      return ra.localeCompare(rb,"es",{numeric:true});
    });

    const filtered = teamId
      ? matches.filter(m=>m.homeId === teamId || m.awayId === teamId)
      : matches;

    if(filtered.length === 0){
      noMsg.style.display = "";
      return;
    }

    noMsg.style.display = "none";

    filtered.forEach(m=>{
      const home = teams.find(t=>t.id === m.homeId)?.name || "?";
      const away = teams.find(t=>t.id === m.awayId)?.name || "?";

      const score =
        (m.homeGoals == null || m.awayGoals == null)
          ? "- : -"
          : (m.homeGoals + " : " + m.awayGoals);

      const tr = document.createElement("tr");

      if(teamId && m.homeGoals != null && m.awayGoals != null){
        const selectedIsHome = m.homeId === teamId;
        const selectedGoals = selectedIsHome ? m.homeGoals : m.awayGoals;
        const opponentGoals = selectedIsHome ? m.awayGoals : m.homeGoals;

        if(selectedGoals > opponentGoals){
          tr.className = "result-win";
        }else if(selectedGoals === opponentGoals){
          tr.className = "result-draw";
        }else{
          tr.className = "result-loss";
        }
      }

      tr.innerHTML = `
        <td>${m.date || ""}</td>
        <td>${m.time || ""}</td>
        <td>${m.round || ""}</td>
        <td>${home.replace(/</g,'&lt;')}</td>
        <td><b>${score}</b></td>
        <td>${away.replace(/</g,'&lt;')}</td>
        <td>${venueHtml(m)}</td>
        <td>${getEffectiveMapsUrl(m) ? `<a href="${getEffectiveMapsUrl(m).replace(/"/g,'&quot;')}" target="_blank" rel="noopener">📍 Mapa</a>` : ""}</td>
        <td>${(m.note || "").replace(/</g,'&lt;')}</td>
      `;

      tb.appendChild(tr);
    });

    document.querySelectorAll(".venue-toggle").forEach(btn => {
      btn.addEventListener("click", () => {
        const el = document.getElementById(btn.dataset.target);
        if(!el) return;
        const open = el.classList.toggle("show");
        btn.textContent = open ? "Ocultar dirección" : "Ver dirección";
      });
    });

  }

  function renderHeader(){
    if(!data) return;

    $("#seasonEnd").style.display = data.seasonFinished ? "block" : "none";
    $("#leagueTitle").textContent = data.leagueName || "Liga de balonmano";

    const w = data.pointsWin ?? 3;
    const d = data.pointsDraw ?? 1;
    const l = data.pointsLoss ?? 0;

    $("#pointsInfo").innerHTML =
      `Sistema de puntos: ` +
      `<span class="badge">Victoria: ${w}</span>` +
      `<span class="badge">Empate: ${d}</span>` +
      `<span class="badge">Derrota: ${l}</span>`;
  }

  function lanzarConfetiFinalTemporada(){
    if(!data || !data.seasonFinished) return;
    if(typeof confetti !== "function") return;

    const duration = 2000;
    const end = Date.now() + duration;

    (function frame(){
      confetti({particleCount:3,angle:60,spread:55,origin:{x:0}});
      confetti({particleCount:3,angle:120,spread:55,origin:{x:1}});

      if(Date.now() < end){
        requestAnimationFrame(frame);
      }
    })();
  }

  function renderAll(){
    renderHeader();
    renderTeamFilter();
    renderStandings();
    renderMatches();
  }

  $("#teamFilter").addEventListener("change", renderMatches);

  loadData();

})();
</script>

</body>
</html>
